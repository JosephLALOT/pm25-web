<header>
  <a routerLink="/" class="logo">PM2.5 Watch</a>
  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Map</a>
    <a routerLink="/">Cities</a>
    <a routerLink="/about" routerLinkActive="active">About</a>
    @if (auth.isAdmin()) {
      <a routerLink="/admin" routerLinkActive="active">Admin</a>
    }

    <button type="button" class="theme" (click)="toggleTheme()"
            [attr.aria-label]="dark() ? 'Switch to light mode' : 'Switch to dark mode'">
      @if (dark()) {
        <!-- soleil -->
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      } @else {
        <!-- lune -->
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      }
    </button>
  </nav>
</header>
